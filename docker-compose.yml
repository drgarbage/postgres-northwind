services:
  db:
    image: bradymholt/postgres-northwind:latest
    container_name: northwind-db
    ports:
      - "5432:5432"
    volumes:
      - ./db-init/99-postgrest.sql:/docker-entrypoint-initdb.d/99-postgrest.sql:ro
      - ./db-init/zz-analysis-views.sql:/docker-entrypoint-initdb.d/zz-analysis-views.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U northwind -d northwind" ]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: northwind-api
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:postgrestpass@db:5432/northwind
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
      PGRST_DB_AGGREGATES_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: northwind-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
